name: Publish to PyPI

# Publishes to PyPI when a v* tag is pushed, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Authentication uses PyPI Trusted Publishing (OpenID Connect) -- there is no API
# token stored in this repository. The trusted publisher is registered at
# https://pypi.org/manage/project/pyDARNmusic/settings/publishing/ and must match
# this repository, this workflow filename (release.yml), and the environment name
# "pypi" exactly.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag version:       $TAG"
          echo "pyproject version: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $VER"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The "pypi" environment gates the upload. Add required reviewers under
    # Settings -> Environments -> pypi to require manual approval before publishing.
    environment:
      name: pypi
      url: https://pypi.org/p/pyDARNmusic
    permissions:
      id-token: write   # required to mint the OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
